name: Star Growth
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-growth
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: anjing-le/anjing-le/.github/actions/star-growth@b0dcc359a2340f279daa450a4fd06382be27d729
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
      - name: Publish chart and source data
        shell: bash
        run: |
          git config user.name anjing-le
          git config user.email 245548353+anjing-le@users.noreply.github.com
          git add assets/star-growth.png assets/star-growth.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh real-data star growth [skip ci]"
          git push origin HEAD:main
