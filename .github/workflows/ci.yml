name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check menu bar interaction
        run: zsh tools/run-menu-bar-regression.sh
      - name: Check menu-bar shelf cancellation, restoration and dashboard
        run: zsh tools/run-menu-bar-shelf-regression.sh
      - name: Check native menu-bar visibility lifecycle without proxy input
        run: zsh tools/run-native-menu-bar-regression.sh
      - name: Test core
        run: swift test --disable-keychain
      - name: Check system monitoring sampling lifecycle and dashboard bounds
        run: zsh tools/run-system-status-regression.sh
      - name: Check screenshot pixel sampling and selection geometry
        run: zsh tools/run-capture-regression.sh
      - name: Check capture permission results and cancellation
        run: zsh tools/run-capture-access-regression.sh
      - name: Check selection adjustment and annotation input routing
        run: zsh tools/run-capture-editor-regression.sh
      - name: Check recording file recovery and annotation exports
        run: zsh tools/run-capture-export-regression.sh
      - name: Check recording audio choices, timestamp mixing and playable AAC output
        run: zsh tools/run-recording-audio-regression.sh
      - name: Check pinned-image transforms and clipboard color cards
        run: zsh tools/run-pin-regression.sh
      - name: Check formatted long text and offline tables without presenting windows
        run: zsh tools/run-text-pin-regression.sh
      - name: Check screenshot shelf persistence and native drag interactions
        run: zsh tools/run-capture-shelf-regression.sh
      - name: Check window thumbnail cancellation and cache bounds
        run: zsh tools/run-switcher-regression.sh
      - name: Check scrollable window grid and settings guides without live windows
        run: zsh tools/run-settings-switcher-regression.sh
      - name: Check window layout geometry and native frame application
        run: zsh tools/run-window-layout-regression.sh
      - name: Check same-process window thread routing and cancellation
        run: zsh tools/run-local-window-regression.sh
      - name: Check quiet update reminders and manual installation choices
        run: zsh tools/run-update-presentation-regression.sh
      - name: Check shared prompt layouts, preferences and keyboard selection
        run: zsh tools/run-prompt-wheel-regression.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a development app with OTA explicitly disabled
        run: scripts/build.sh --disable-updates
      - name: Check DMG layout, repeatable mounts and copied application identity
        run: zsh tools/run-dmg-regression.sh dist/MacOSX.app
